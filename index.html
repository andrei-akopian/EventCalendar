<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Calendar Maker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage">
    <article class="paper" id="paper">
      <header class="paper-header">
        <div>
          <h1 id="paperTitle" class="inline-value" contenteditable="true" role="textbox" aria-label="Calendar title" data-placeholder="Untitled calendar">Academic year</h1>
        </div>
        <div id="paperYear" class="paper-year inline-value" contenteditable="true" role="textbox" aria-label="Calendar year" data-placeholder="YYYY">2026</div>
      </header>
      <p id="paperSubtitle" class="paper-subtitle inline-value" contenteditable="true" role="textbox" aria-label="Calendar subtitle">A quiet overview for the desk, the wall, or the first page of a planning book.</p>
      <div class="calendar-layout" id="calendarLayout">
        <div class="month-column" id="monthColumnOne"></div>
        <div class="month-column" id="monthColumnTwo"></div>
        <aside class="legend-rail" aria-label="Event legend and calendar settings">
          <p class="legend-label">Legend</p>
          <button class="hud-button event-button" id="addEventButton" type="button" disabled>Add event</button>
          <button class="clear-events" id="clearEventsButton" type="button" disabled>Remove all events</button>
          <span class="selection-status" id="selectionStatus" aria-live="polite"></span>
          <div class="event-legend" id="eventLegend"><p class="legend-note">Events appear here</p></div>
          <div class="legend-settings" aria-label="Calendar settings">
            <label for="paperSize">Paper</label>
            <select class="paper-size" id="paperSize"><option value="a4">A4</option><option value="letter">Letter</option></select>
            <label for="weekStart">Week starts</label>
            <select class="week-start" id="weekStart"><option value="1">Monday</option><option value="0">Sunday</option></select>
          </div>
        </aside>
      </div>
      <footer class="paper-footer"><span id="creationDate"></span></footer>
    </article>
    <div class="bottom-controls"><button class="hud-button print-button" id="printButton" type="button">Print / save PDF</button></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
